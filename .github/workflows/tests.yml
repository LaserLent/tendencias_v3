name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and run tests (clean)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov
          python -c "import sys,pytest; print('PY', sys.version); print('PYTEST', pytest.__version__)"
          python -m pytest -q

      - name: Enforce coverage >= 70%
        run: |
          python - << 'PY'
          import sys, xml.etree.ElementTree as ET
          cov = ET.parse("coverage.xml").getroot().attrib.get("line-rate")
          pct = float(cov) * 100 if cov else 0.0
          print(f"Coverage: {pct:.2f}%")
          sys.exit(0 if pct >= 70.0 else 1)
          PY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.py }}
          path: coverage.xml
