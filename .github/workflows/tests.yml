name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Seed DB (minimal)
        run: |
          python - << 'PY'
          from core.db import init_db, get_conn, upsert_article
          from datetime import datetime, timezone
          init_db()
          now = datetime.now(timezone.utc).isoformat()
          seeds = [
            {"title":"Seed 1","url":"https://example.com/1","canonical_url":"https://example.com/1","date":now,"source":"Seed","category":"TECNOLOGIA","source_type":"rss"},
            {"title":"Seed 2","url":"https://example.com/2","canonical_url":"https://example.com/2","date":now,"source":"Seed","category":"TECNOLOGIA","source_type":"rss"},
            {"title":"Seed 3","url":"https://example.com/3","canonical_url":"https://example.com/3","date":now,"source":"Seed","category":"TECNOLOGIA","source_type":"rss"},
          ]
          with get_conn() as conn:
              for it in seeds:
                  try:
                      upsert_article(it, conn=conn)
                  except TypeError:
                      upsert_article(conn=conn, **it)
          PY

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q
