name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        py: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
          cache: "pip"

       - name: Install and run tests (isolated venv)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - << 'PY'
          import os, sys, subprocess, venv, platform
          venv_dir = ".ci-venv"
          venv.create(venv_dir, with_pip=True, clear=True)
          py = os.path.join(venv_dir, "Scripts", "python.exe") if os.name == "nt" else os.path.join(venv_dir, "bin", "python")
          def run(*args): 
              print("+", *args); subprocess.check_call([py, *args])
          run("-m", "pip", "install", "--upgrade", "pip", "setuptools", "wheel")
          run("-m", "pip", "install", "-r", "requirements.txt")
          run("-m", "pip", "install", "pytest", "pytest-cov")
          run("-c", "import sys,site,pytest; print('PY', sys.executable); print('PYV', sys.version); print('SITE', site.getsitepackages()); print('PYTEST', pytest.__version__)")
          run("-m", "pytest", "-q", "--cov=core", "--cov=services", "--cov=api", "--cov-report=term-missing", "--cov-report=xml:coverage.xml")
          PY


      - name: Enforce coverage >= 70%
        run: |
          python - << 'PY'
          import sys, xml.etree.ElementTree as ET
          cov = ET.parse("coverage.xml").getroot().attrib.get("line-rate")
          pct = float(cov) * 100 if cov else 0.0
          print(f"Coverage: {pct:.2f}%")
          sys.exit(0 if pct >= 70.0 else 1)
          PY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.py }}
          path: coverage.xml
